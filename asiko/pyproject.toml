[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asiko"
version = "0.1.0"
description = "ASIKO — подготовка аудио и переходов для видеоигр по текстовому заданию"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "PySide6==6.11.2",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "sounddevice==0.5.6",
    "librosa==1.0.0",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "pyloudnorm==0.2.0",
    "keyring==25.7.0",
    "platformdirs==4.12.3",
    "anthropic==1.11.0",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "pyinstaller==6.22.3"]

[project.scripts]
asiko-cli = "asiko.__main__:main"

[project.gui-scripts]
asiko = "asiko.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asiko = ["ui/icon.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:sounddevice",
]
markers = [
    "slow: долгие тесты",
    "packaged: проверка упакованного приложения (нужна сборка)",
]
